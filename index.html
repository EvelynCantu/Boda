<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<style>
  :root{ color-scheme: light dark;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px); }
  html,body{ margin:0; }
  img{ max-width:100%; }
  [hidden]{ display:none !important; }
</style>
</head>
<body><title>Boda Master Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================ TOKENS ============================ */
:root{
  --paper:#F4F1E9; --paper2:#EAE5D8; --card:#FFFDF8; --soft:#F7F4EC;
  --ink:#22201C; --ink2:#6E685D; --ink3:#948C7E;
  --line:#E4DED1; --line2:#D6CEBC;
  --olive:#3E4C3A; --olive2:#5C6E55; --olive-t:#3E4C3A;
  --brass:#9C7734; --brass2:#D8C59B; --brass-t:#8A6A2E;
  --blush:#B5726A;
  --ok-bg:#E5EDE0; --ok-fg:#42632F; --warn-bg:#F5EBD3; --warn-fg:#8A6A20;
  --bad-bg:#F2DFDA; --bad-fg:#A04E3F; --neu-bg:#EFEBE1; --neu-fg:#6E685D;
  --shadow:0 12px 32px -26px rgba(40,34,20,.65);
  --ring:rgba(156,119,52,.28);
  --grain:.035;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#14170F; --paper2:#1B1F16; --card:#1C2018; --soft:#222719;
    --ink:#EDE8DA; --ink2:#A29B8A; --ink3:#7C7566;
    --line:#2E3427; --line2:#3C4433;
    --olive:#9DB393; --olive2:#7E9474; --olive-t:#B9CBB0;
    --brass:#D9B872; --brass2:#6B5730; --brass-t:#E6CB92;
    --blush:#D0958C;
    --ok-bg:#23301E; --ok-fg:#A8C89A; --warn-bg:#332A15; --warn-fg:#E0C081;
    --bad-bg:#37231E; --bad-fg:#E0A094; --neu-bg:#242A1D; --neu-fg:#A29B8A;
    --shadow:0 12px 32px -24px rgba(0,0,0,.9);
    --ring:rgba(217,184,114,.25);
    --grain:.05;
  }
}
:root[data-theme="dark"]{
  --paper:#14170F; --paper2:#1B1F16; --card:#1C2018; --soft:#222719;
  --ink:#EDE8DA; --ink2:#A29B8A; --ink3:#7C7566;
  --line:#2E3427; --line2:#3C4433;
  --olive:#9DB393; --olive2:#7E9474; --olive-t:#B9CBB0;
  --brass:#D9B872; --brass2:#6B5730; --brass-t:#E6CB92;
  --blush:#D0958C;
  --ok-bg:#23301E; --ok-fg:#A8C89A; --warn-bg:#332A15; --warn-fg:#E0C081;
  --bad-bg:#37231E; --bad-fg:#E0A094; --neu-bg:#242A1D; --neu-fg:#A29B8A;
  --shadow:0 12px 32px -24px rgba(0,0,0,.9);
  --ring:rgba(217,184,114,.25);
  --grain:.05;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:'Jost',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
/* grano de papel */
body:before{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none; opacity:var(--grain);
  background-image:radial-gradient(circle at 15% 25%, #8a7a50 .6px, transparent .7px),
                   radial-gradient(circle at 68% 72%, #6b5f3a .5px, transparent .6px),
                   radial-gradient(circle at 42% 88%, #9a8a5e .5px, transparent .6px);
  background-size:37px 37px, 53px 53px, 71px 71px;
}
.dsp{font-family:'Bodoni Moda',Didot,'Times New Roman',serif; font-weight:500; letter-spacing:.01em}
svg.i{width:18px;height:18px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============================ SHELL ============================ */
.shell{position:relative;z-index:1;min-height:100%}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;
  background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line)}
.topbar-in{max-width:1120px;margin:0 auto;padding:11px 18px;display:flex;align-items:center;gap:12px}
.crest{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;color:#F4F1E9;
  background:radial-gradient(120% 120% at 32% 22%,#68795F,#33402F);
  box-shadow:0 3px 12px -4px rgba(35,45,30,.55),inset 0 1px 0 rgba(255,255,255,.22)}
.crest svg{width:19px;height:19px;stroke-width:1.5}
.ttl{flex:1;min-width:0}
.ttl h1{margin:0;font-size:17px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl p{margin:1px 0 0;font-size:11.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:6px;flex:none}
.tbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);
  color:var(--ink2);display:grid;place-items:center;cursor:pointer;transition:.15s}
.tbtn:hover{color:var(--olive);border-color:var(--brass2)}
.syncdot{width:7px;height:7px;border-radius:50%;background:var(--olive2);flex:none;margin-right:2px}
.syncdot.local{background:var(--brass)}
.syncdot.pend,.syncdot.readonly{background:var(--blush)}
.syncdot.busy{animation:pulse 1.1s infinite}
@keyframes pulse{50%{opacity:.25}}
.pendchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--blush);color:var(--blush);
  background:transparent;border-radius:999px;padding:5px 10px;font-size:11.5px;cursor:pointer;white-space:nowrap}
.pendchip svg{width:13px;height:13px}
.pendchip.on{animation:pulse 1.2s infinite}

.wrap{max-width:1120px;margin:0 auto;padding:0 18px 116px;position:relative}
@media(min-width:900px){
  .wrap{padding-left:104px;padding-bottom:48px}
  .topbar-in{padding-left:104px}
}

/* riel escritorio */
.rail{display:none}
@media(min-width:900px){
  .rail{display:flex;position:fixed;left:0;top:0;bottom:0;z-index:35;width:86px;
    flex-direction:column;align-items:center;gap:4px;padding:14px 0;
    background:var(--paper2);border-right:1px solid var(--line)}
  .rail .ri{width:66px;padding:9px 2px;border:none;background:none;cursor:pointer;border-radius:12px;
    display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink2);font-size:10.5px;transition:.15s}
  .rail .ri:hover{color:var(--ink)}
  .rail .ri.on{color:var(--olive-t)}
  .rail .ri.on .nic{background:var(--olive);color:#F4F1E9}
  .rail .nic{width:38px;height:30px;border-radius:10px;display:grid;place-items:center;transition:.18s}
}
/* nav inferior móvil */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;border-top:1px solid var(--line);
  background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(14px);
  padding-bottom:env(safe-area-inset-bottom,0px)}
@media(min-width:900px){.nav{display:none}}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);padding:7px 4px 9px}
.ni{background:none;border:none;cursor:pointer;padding:5px 1px;border-radius:11px;display:flex;
  flex-direction:column;align-items:center;gap:3px;color:var(--ink2);font-size:9.5px;transition:.15s}
.ni.on{color:var(--olive-t)} .ni.on .nic{background:var(--olive);color:#F4F1E9}
.nic{width:36px;height:26px;border-radius:9px;display:grid;place-items:center;transition:.18s}
.nic svg{width:17px;height:17px}

/* ============================ PRIMITIVAS ============================ */
.phead{padding:22px 0 14px}
.eyebrow{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--brass-t);font-weight:500;
  display:flex;align-items:center;gap:9px}
.eyebrow:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,var(--line2),transparent)}
.phead h2{margin:8px 0 0;font-size:29px;line-height:1.04;text-wrap:balance}
.phead p{margin:6px 0 0;color:var(--ink2);font-size:13.5px;max-width:62ch}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.pad{padding:17px}
.grid{display:grid;gap:13px}
@media(min-width:680px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.g4{grid-template-columns:repeat(4,1fr)}}
.stack{display:flex;flex-direction:column;gap:13px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mut{color:var(--ink2)} .sm{font-size:12px} .xs{font-size:11px}
.divline{height:1px;background:var(--line);margin:15px 0}

.sec-t{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:24px 0 11px}
.sec-t h3{margin:0;font-size:19px}
.sec-t a,.sec-t button.lnk{font-size:12px;color:var(--brass-t);background:none;border:none;cursor:pointer;padding:0}

.ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--soft);
  color:var(--olive-t);border:1px solid var(--line);flex:none}
.ic svg{width:16px;height:16px}

/* portada grabada */
.hero{position:relative;overflow:hidden;border:none;border-radius:18px;color:#EFE9DA;
  background:linear-gradient(145deg,#46543F 0%,#36422F 55%,#2A3325 100%)}
.hero:before{content:"";position:absolute;inset:0;
  background:radial-gradient(75% 110% at 88% -12%,rgba(216,197,155,.30),transparent 58%)}
.hero:after{content:"";position:absolute;inset:10px;border:1px solid rgba(216,197,155,.26);border-radius:12px;pointer-events:none}
.hero .pad{position:relative;padding:22px}
.hero-row{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.hero .days{font-size:56px;line-height:.86;letter-spacing:-.01em}
.hero .dlab{font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.72;margin-top:8px}
.hero .who{font-size:22px;margin:0 0 2px}
.hero .when{font-size:12.5px;opacity:.8}
.hero .chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
.hero .chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.11);
  border:1px solid rgba(239,233,218,.2);padding:5px 11px;border-radius:999px;font-size:12px}
.ringwrap{position:relative;width:104px;height:104px;flex:none}
.ringwrap .pct{position:absolute;inset:0;display:grid;place-items:center;font-size:21px}

/* estadísticas */
.stat .k{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2)}
.stat .v{font-size:25px;margin-top:5px;line-height:1}
.stat .s{font-size:11.5px;color:var(--ink2);margin-top:6px}

.bar{height:7px;border-radius:999px;background:var(--paper2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--brass),#C6A462);transition:width .6s cubic-bezier(.2,.8,.3,1)}
.bar.green>i{background:linear-gradient(90deg,var(--olive2),var(--olive))}
.bar.thin{height:5px}

.badge{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;
  font-weight:500;display:inline-block;white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok-fg)}
.badge.warn{background:var(--warn-bg);color:var(--warn-fg)}
.badge.bad{background:var(--bad-bg);color:var(--bad-fg)}
.badge.neu{background:var(--neu-bg);color:var(--neu-fg)}
.tag{font-size:10.5px;padding:2px 8px;border-radius:999px;background:var(--soft);border:1px solid var(--line);color:var(--ink2)}

.btn{cursor:pointer;border-radius:11px;font-size:13.5px;font-weight:400;padding:10px 15px;
  border:1px solid var(--line2);background:var(--card);color:var(--ink);transition:.15s;
  display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn:hover{border-color:var(--brass2)}
.btn svg{width:15px;height:15px}
.btn.pri{background:linear-gradient(140deg,#4E5C47,#33402F);color:#F2EEE3;border-color:transparent;
  box-shadow:0 8px 18px -12px rgba(51,64,47,.9)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.gold{background:linear-gradient(140deg,#B08C43,#8A6A2E);color:#FBF7ED;border-color:transparent}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:9px}
.btn.block{width:100%}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad-fg);border-color:var(--bad-fg)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.iconbtn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);
  color:var(--ink2);cursor:pointer;display:grid;place-items:center;flex:none;transition:.15s}
.iconbtn:hover{color:var(--olive-t);border-color:var(--brass2)}
.iconbtn.del:hover{color:var(--bad-fg);border-color:var(--bad-fg)}
.iconbtn svg{width:14px;height:14px}

label{font-size:11.5px;color:var(--ink2);display:block;margin-bottom:5px}
input,select,textarea{width:100%;padding:10px 11px;border-radius:10px;border:1px solid var(--line2);
  background:var(--soft);outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--brass);background:var(--card);
  box-shadow:0 0 0 3px var(--ring)}
textarea{resize:vertical;min-height:72px}
.field{margin-bottom:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.seg{display:flex;gap:3px;background:var(--paper2);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:15px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-width:78px;border:none;background:none;cursor:pointer;font-size:12.5px;padding:9px 6px;
  border-radius:9px;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s}
.seg button.on{background:var(--card);color:var(--olive-t);font-weight:500;box-shadow:0 3px 10px -7px rgba(40,34,20,.6)}
.seg svg{width:14px;height:14px}

.chips{display:flex;gap:7px;flex-wrap:wrap}
.fchip{cursor:pointer;font-size:12px;padding:6px 12px;border-radius:999px;border:1px solid var(--line2);
  background:var(--card);color:var(--ink2);transition:.15s}
.fchip:hover{border-color:var(--brass2)}
.fchip.on{background:var(--olive);color:#F2EEE3;border-color:var(--olive)}

/* filas de lista */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:none}
.row .main{flex:1;min-width:0}
.row .t{font-size:14px;line-height:1.3}
.row .t.done{text-decoration:line-through;color:var(--ink3)}
.row .meta{font-size:11.5px;color:var(--ink2);margin-top:3px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.row .acts{display:flex;gap:6px;flex:none;opacity:.75}
.row:hover .acts{opacity:1}

.tbox{width:21px;height:21px;border-radius:6px;border:1.6px solid var(--line2);flex:none;cursor:pointer;
  display:grid;place-items:center;color:transparent;background:var(--card);transition:.15s}
.tbox:hover{border-color:var(--brass)}
.tbox.on{background:var(--olive);border-color:var(--olive);color:#F2EEE3}
.tbox svg{width:13px;height:13px;stroke-width:2.4}

.phase{font-size:13px;color:var(--olive-t);margin:20px 0 6px;display:flex;align-items:center;gap:9px}
.phase:before{content:"";width:5px;height:5px;border-radius:50%;background:var(--brass);flex:none}
.phase:after{content:"";height:1px;flex:1;background:var(--line)}
.phase .n{color:var(--ink3);font-size:11px}

.datechip{width:44px;flex:none;text-align:center;border:1px solid var(--line);border-radius:10px;
  padding:5px 0;background:var(--soft)}
.datechip .d{font-size:17px;line-height:1.05;font-family:'Bodoni Moda',serif}
.datechip .m{font-size:9px;text-transform:uppercase;color:var(--ink2);letter-spacing:.06em}

.money{font-family:'Bodoni Moda',serif;font-size:16px}
.kv{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:7px 0}
.kv+.kv{border-top:1px dashed var(--line)}
.kv .k{font-size:12.5px;color:var(--ink2)}
.kv .v{font-family:'Bodoni Moda',serif;font-size:15px}

.empty{text-align:center;padding:34px 16px;color:var(--ink2)}
.empty .eic{width:52px;height:52px;border-radius:15px;margin:0 auto 12px;display:grid;place-items:center;
  background:var(--soft);border:1px solid var(--line);color:var(--brass-t)}
.empty .eic svg{width:22px;height:22px}
.empty h4{margin:0 0 5px;font-size:16px;font-family:'Bodoni Moda',serif;font-weight:500;color:var(--ink)}
.empty p{margin:0 auto 14px;font-size:12.5px;max-width:34ch}

.note{font-size:12.5px;color:var(--ink2);background:var(--soft);border:1px dashed var(--brass2);
  border-radius:11px;padding:11px 13px;line-height:1.5}

/* mesas */
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:12px}
.tbl{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:12px;text-align:center;
  cursor:pointer;transition:.15s}
.tbl:hover{border-color:var(--brass2)}
.tbl.armed{border-color:var(--olive);box-shadow:0 0 0 3px var(--ring)}
.tbl.over{border-color:var(--brass);background:var(--soft)}
.tbl .disc{width:70px;height:70px;border-radius:50%;margin:0 auto 9px;position:relative;display:grid;place-items:center;
  background:var(--soft);border:1px solid var(--line2)}
.tbl .disc .n{font-family:'Bodoni Moda',serif;font-size:19px}
.tbl .nm{font-size:12.5px;line-height:1.2}
.tbl .oc{font-size:10.5px;color:var(--ink2);margin-top:3px}
.tbl .seats{margin-top:9px;display:flex;flex-direction:column;gap:3px;text-align:left}
.tbl .seat{font-size:11px;color:var(--ink2);display:flex;align-items:center;gap:5px}
.tbl .seat button{border:none;background:none;color:var(--ink3);cursor:pointer;padding:0;margin-left:auto}
.tbl .seat button:hover{color:var(--bad-fg)}
.gchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:6px 11px;border-radius:999px;
  border:1px solid var(--line2);background:var(--card);cursor:grab;transition:.15s}
.gchip:hover{border-color:var(--brass2)}
.gchip.armed{background:var(--olive);color:#F2EEE3;border-color:var(--olive)}
.gchip .p{font-size:10px;opacity:.7}

.av{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;
  font-family:'Bodoni Moda',serif;font-size:14px;color:#F7F3E8}

/* hoja modal */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(30,26,16,.5);backdrop-filter:blur(3px);
  display:flex;align-items:flex-end;justify-content:center;animation:fade .2s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media(min-width:560px){.scrim{align-items:center;padding:20px}}
.sheet{background:var(--paper);width:100%;max-width:470px;border-radius:20px 20px 0 0;border:1px solid var(--line);
  max-height:88vh;overflow:auto;animation:up .26s cubic-bezier(.2,.8,.3,1) both;
  padding-bottom:env(safe-area-inset-bottom,0px)}
@media(min-width:560px){.sheet{border-radius:20px}}
@keyframes up{from{transform:translateY(34px);opacity:0}to{transform:none;opacity:1}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px 19px 3px}
.sheet-h h3{margin:0;font-size:19px}
.sheet-b{padding:13px 19px 20px}
.mrow{display:flex;align-items:center;gap:12px;padding:12px 13px;border:1px solid var(--line);border-radius:12px;
  background:var(--card);margin-bottom:8px;cursor:pointer;transition:.15s;width:100%;text-align:left}
.mrow:hover{border-color:var(--brass2)}
.mrow .t{font-size:14.5px} .mrow .s{font-size:11.5px;color:var(--ink2)}

.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(16px);z-index:80;
  background:var(--olive);color:#F2EEE3;padding:10px 17px;border-radius:999px;font-size:12.5px;opacity:0;
  transition:.25s;pointer-events:none;box-shadow:0 12px 28px -12px rgba(0,0,0,.5);max-width:88vw;text-align:center}

  ["Contratar florista y decoración","Decoración",2,8],["Ordenar invitaciones","Papelería",2,7],
  ["Prueba de maquillaje y peinado","Belleza",2,6],["Trámites de ceremonia (civil / religiosa)","Ceremonia",2,6],

  ["Pagos finales a proveedores","Planeación",4,1],["Acomodo definitivo de mesas","Planeación",4,1],
  ["Confirmar itinerario con proveedores","Planeación",5,.5],["Ensayo de la ceremonia","Ceremonia",5,.25],
  ["Preparar maletas de la luna de miel","Logística",5,.2]];

  ["10:30","13:00","Maquillaje y peinado de la novia","Preparativos"],

const uid = () => Math.random().toString(36).slice(2,10);

/* ---------------------------- MODELO ---------------------------- */
function seed(){
  return {
    settings:{couple:"Nuestra Boda",date:"",guests:150,budget:350000,currency:"MXN",
      venueName:"",venueLocation:"",savingsMode:"estimado",savingsGoal:0},
    tasks: DEFAULT_TASKS.map(([title,category,ph,off],i)=>({id:"t"+i,title,category,phase:PHASES[ph],off,done:false})),
    budget: DEFAULT_BUDGET.map(([name,category,type,est],i)=>({id:"b"+i,name,category,type,est,actual:null,paid:false})),
    payments:[], savings:[], vendors:[],
    guests:[], tables:[], rooms:[], sponsors:[], contacts:[], gifts:[],
    timeline:[], events:[],
    songs:[], blacklist:[], ideas:[], notes:"", venue:{notes:""}
  };
}
const ARR = ["tasks","budget","payments","savings","vendors","guests","tables","rooms","sponsors",
  "contacts","gifts","timeline","events","songs","blacklist","ideas"];
function normalize(d){
  const b = seed(); if(!d || typeof d!=="object") return b;
  const o = {...b, settings:{...b.settings,...(d.settings||{})}, venue:{...b.venue,...(d.venue||{})},
    notes: typeof d.notes==="string" ? d.notes : ""};
  ARR.forEach(k=>{ o[k] = Array.isArray(d[k]) ? d[k] : (k==="tasks"||k==="budget" ? b[k] : []); });
  if(Array.isArray(d.inspiration) && !Array.isArray(d.ideas)) o.ideas = d.inspiration;   // formato anterior
  o.guests.forEach(g=>{ if(!g.id) g.id=uid(); if(g.partySize==null) g.partySize=1; if(!g.rsvp) g.rsvp="pending"; });
  o.tables.forEach(t=>{ if(!Array.isArray(t.guestIds)) t.guestIds=[]; });
  o.rooms.forEach(r=>{ if(!Array.isArray(r.guestIds)) r.guestIds=[]; });
  return o;
}

/* Documentos en la nube: una colección lógica por documento */
const DOCS = {
  settings:{path:"plan/settings", keys:null},
  tasks:   {path:"plan/tasks",    keys:["tasks"]},
  money:   {path:"plan/money",    keys:["budget","payments","savings","vendors"]},
  people:  {path:"plan/people",   keys:["guests","tables","rooms","sponsors","contacts","gifts"]},
  day:     {path:"plan/day",      keys:["timeline","events"]},
  extras:  {path:"plan/extras",   keys:["songs","blacklist","ideas"]}
};
const DOC_OF = {};
Object.keys(DOCS).forEach(dk => (DOCS[dk].keys||[]).forEach(k => DOC_OF[k]=dk));

let state = seed();
let db = null, syncState = "local", dirty = {}, timers = {}, seenDoc = {};
let pend = {};              // documentos con cambios locales sin subir
let retryT = null, readOnly = false, downloads = null;

function loadLocal(){ try{ const r=localStorage.getItem(LS); if(r) return normalize(JSON.parse(r)); }catch(e){} return null; }
function saveLocal(){ try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){} }
function loadPend(){ try{ const r=localStorage.getItem(LS+"_pend"); if(r) pend=JSON.parse(r)||{}; }catch(e){ pend={}; } }
function savePend(){ try{ localStorage.setItem(LS+"_pend", JSON.stringify(pend)); }catch(e){} }
const pendCount = () => Object.keys(pend).filter(k=>pend[k]).length;

function bodyOf(dk){
  if(dk==="settings") return {...state.settings, notes:state.notes, venue:state.venue};
  const o={}; DOCS[dk].keys.forEach(k=>o[k]=state[k]); return o;
}
function applyDoc(dk, data){
  if(!data) return;
  if(dk==="settings"){
    const {notes, venue, ...rest} = data;
    state.settings = {...seed().settings, ...rest};
    if(typeof notes==="string") state.notes = notes;
    if(venue) state.venue = {...state.venue, ...venue};
  } else {
    DOCS[dk].keys.forEach(k=>{ if(Array.isArray(data[k])) state[k]=data[k]; });
  }
}
/** Marca cambios y los guarda (local al instante, nube con rebote). */
function save(keys){
  saveLocal();
  const dks = keys ? [...new Set([].concat(keys).map(k=>DOC_OF[k]||k))] : Object.keys(DOCS);
  dks.forEach(dk=>{
    if(!DOCS[dk]) return;
    dirty[dk]=true; pend[dk]=true;            // pendiente hasta que el servidor confirme
    clearTimeout(timers[dk]);
    timers[dk] = setTimeout(()=>flush(dk), 550);
  });
  savePend();
  refreshSyncUI(db ? "busy" : "local");
}

async function flush(dk){
  if(!db || readOnly){ refreshSyncUI(readOnly?"readonly":"local"); return; }
  const body = bodyOf(dk);
  dirty[dk] = false;
  try{
    await db.doc(DOCS[dk].path).set(body);
    if(!dirty[dk]){ delete pend[dk]; savePend(); }   // sin cambios nuevos mientras subía
    refreshSyncUI(pendCount() ? "pend" : "cloud");
  }catch(e){
    const code = e && e.code;
    if(code==="invalid_argument"){
      readOnly = true; delete pend[dk]; savePend();
      refreshSyncUI("readonly");
      toast("Tienes acceso de solo lectura: tus cambios no se guardan en la nube.");
    } else if(code==="not_granted" || code==="capability_disabled" || code==="revoked"){
      db = null; refreshSyncUI("local");
    } else {
      pend[dk]=true; savePend();                     // sin conexión o falla temporal: se reintenta
      refreshSyncUI("pend"); scheduleRetry();
    }
  }
}

/** Reintenta todo lo pendiente; se llama al recuperar conexión, al volver a la pestaña y cada 20 s. */
function retryPending(manual){
  if(!db || readOnly) return;
  const list = Object.keys(pend).filter(k=>pend[k]);
  if(!list.length){ if(manual) toast("Todo está guardado en la nube"); return; }
  if(manual) toast("Subiendo "+list.length+" cambio"+(list.length>1?"s":"")+"…");
  refreshSyncUI("busy");
  list.forEach(dk=>flush(dk));
}
function scheduleRetry(){
  if(retryT) return;
  retryT = setTimeout(()=>{ retryT=null; if(pendCount()) retryPending(); }, 20000);
}
function refreshSyncUI(s){
  if(s) syncState = s;
  if(syncState!=="readonly" && syncState!=="local" && !pendCount() && db) syncState="cloud";
  const d = document.getElementById("syncdot");
  if(d) d.className = "syncdot "+(syncState==="cloud"?"":syncState);
  const c = document.getElementById("pendchip");
  const n = pendCount();
  if(c){
    if(n && syncState!=="readonly"){ c.hidden=false; c.className="pendchip"+(syncState==="busy"?" on":"");
      c.querySelector("span").textContent = n+(n>1?" cambios":" cambio")+" por subir"; }
    else c.hidden = true;
  }
}

async function connect(){
  try{ downloads = await window.claude?.use?.("downloads"); }catch(e){}
  let d=null; try{ d = await window.claude?.use?.("db"); }catch(e){}
  if(!d){ refreshSyncUI("local"); return; }
  db = d;
  refreshSyncUI(pendCount() ? "pend" : "cloud");
  Object.keys(DOCS).forEach(dk=>{
    try{
      db.doc(DOCS[dk].path).onSnapshot(snap=>{
        const first = !seenDoc[dk]; seenDoc[dk]=true;
        if(snap.exists){
          // Nunca pisar cambios locales que aún no subieron
          if(dirty[dk] || pend[dk] || snap.metadata.hasPendingWrites) return;
          applyDoc(dk, snap.data()); saveLocal(); render();
        } else if(first && (pend[dk] || hasLocalData(dk))){
          pend[dk]=true; savePend(); flush(dk);
        }
      }, err=>{
        if(err.code==="revoked" || err.code==="not_granted"){ db=null; refreshSyncUI("local"); }
        else scheduleRetry();
      });
    }catch(e){}
  });
  if(pendCount()) setTimeout(()=>retryPending(), 800);   // sube lo que quedó de la sesión anterior
}

window.addEventListener("online", ()=>{ refreshSyncUI(); retryPending(); });
window.addEventListener("offline", ()=>refreshSyncUI(pendCount()?"pend":syncState));
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && pendCount()) retryPending(); });
setInterval(()=>{ if(pendCount()) retryPending(); }, 20000);
window.addEventListener("beforeunload", e=>{
  if(pendCount() && db && !readOnly){ e.preventDefault(); e.returnValue=""; return ""; }
});
function hasLocalData(dk){
  if(dk==="settings") return !!(state.settings.date || state.settings.couple!=="Nuestra Boda");
  return DOCS[dk].keys.some(k=>{
    if(k==="tasks") return state.tasks.some(t=>t.done);
    if(k==="budget") return state.budget.some(b=>b.actual!=null||b.paid);
    return (state[k]||[]).length>0;
  });
}

function daysUntil(date){ if(!date) return null; const d=new Date(date+"T00:00:00"); if(isNaN(d)) return null;
  return Math.ceil((d - new Date().setHours(0,0,0,0))/86400000); }
function fmtDate(iso, opt){ if(!iso) return ""; const d=new Date(iso+"T00:00:00"); if(isNaN(d)) return iso;
  try{ return d.toLocaleDateString("es-MX", opt||{day:"numeric",month:"long",year:"numeric"}); }catch(e){ return iso; } }

  return {d:d.getDate(), m:MESES[d.getMonth()]}; }

  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

function toast(msg){ const t=document.getElementById("toast"); if(!t) return; t.textContent=msg; t.classList.add("show");

  return '<option value="'+esc(v)+'"'+(String(sel)===String(v)?" selected":"")+'>'+esc(l)+'</option>'; }).join(""); }

/* ============================ MÉTRICAS ============================ */
function metrics(){
  const s = state.settings;
  const confirmed = sumParty(state.guests.filter(g=>g.rsvp==="confirmed"));
  const pending = sumParty(state.guests.filter(g=>g.rsvp==="pending"));
  const declined = sumParty(state.guests.filter(g=>g.rsvp==="declined"));
  const headcount = confirmed || Number(s.guests) || 0;
  const est = state.budget.reduce((a,b)=>a+itemEst(b,headcount),0);
  const real = state.budget.reduce((a,b)=>a+itemReal(b,headcount),0);
  const paidBudget = state.budget.filter(b=>b.paid).reduce((a,b)=>a+itemReal(b,headcount),0);
  const paidPays = state.payments.filter(p=>p.paid).reduce((a,p)=>a+(Number(p.amount)||0),0);
  const paid = Math.max(paidBudget, paidPays);
  const saved = state.savings.reduce((a,x)=>a+(Number(x.amount)||0),0);
  const goal = s.savingsMode==="meta" ? (Number(s.savingsGoal)||0) : real;
  const tasksActive = state.tasks.length;
  const tasksDone = state.tasks.filter(t=>t.done).length;
  const overdue = state.payments.filter(p=>!p.paid && p.due && p.due < todayISO()).length;
  const seated = state.tables.reduce((a,t)=>a+t.guestIds.length,0);
  return {confirmed,pending,declined,headcount,est,real,paid,saved,goal,tasksActive,tasksDone,overdue,seated,
    pct: tasksActive? tasksDone/tasksActive : 0,
    budgetPct: real? Math.min(1,paid/real) : 0,
    savePct: goal? Math.min(1,saved/goal) : 0};
}

function delGuest(id){ if(!confirm("¿Eliminar a este invitado?")) return;

function guestTables(){ return unitsView("table"); }
function guestRooms(){ return unitsView("room"); }
function unitsView(kind){
  const isT = kind==="table", key = isT?"tables":"rooms", units = state[key];
  const byId = {}; state.guests.forEach(g=>byId[g.id]=g);
  const assigned = new Set(); units.forEach(u=>u.guestIds.forEach(id=>assigned.add(id)));
  const pool = state.guests.filter(g=>!assigned.has(g.id) && (isT ? g.rsvp!=="declined" : g.needsLodging));
  const occ = u => u.guestIds.reduce((s,id)=>s+(Number(byId[id]?byId[id].partySize:1)||1),0);
  const seatedTotal = units.reduce((a,u)=>a+occ(u),0);
  const capTotal = units.reduce((a,u)=>a+(Number(u.capacity)||0),0);

  const grid = units.length ? '<div class="tables">'+units.map(u=>{
    const o = occ(u), cap = Number(u.capacity)||0, full = o>=cap && cap>0, over = o>cap;
    return '<div class="tbl'+(ui.armed?" armed":"")+'" data-unit="'+u.id+'" onclick="dropOn(\''+kind+'\',\''+u.id+'\')"'
      + ' ondragover="event.preventDefault();this.classList.add(\'over\')" ondragleave="this.classList.remove(\'over\')"'
      + ' ondrop="event.preventDefault();this.classList.remove(\'over\');dropOn(\''+kind+'\',\''+u.id+'\',event.dataTransfer.getData(\'text/plain\'))">'
      + '<div class="disc" style="'+(over?'border-color:var(--bad-fg)':full?'border-color:var(--olive)':'')+'"><span class="n">'+o+'</span></div>'
      + '<div class="nm">'+esc(u.label||(isT?"Mesa":"Habitación"))+'</div>'
      + '<div class="oc">'+o+' / '+cap+(u.hotel?' · '+esc(u.hotel):'')+'</div>'
      + (u.guestIds.length?'<div class="seats">'+u.guestIds.map(id=>'<span class="seat">'+svg("check",11)
          +esc(byId[id]?byId[id].name:"—")+'<button onclick="event.stopPropagation();unassign(\''+kind+'\',\''+u.id+'\',\''+id+'\')" aria-label="Quitar">'+svg("x",11)+'</button></span>').join("")+'</div>':'')
      + '<div style="margin-top:8px;display:flex;gap:5px;justify-content:center">'
        + '<button class="iconbtn" onclick="event.stopPropagation();openForm(\''+kind+'\',\''+u.id+'\')" aria-label="Editar">'+svg("pencil")+'</button>'
        + '<button class="iconbtn del" onclick="event.stopPropagation();delUnit(\''+kind+'\',\''+u.id+'\')" aria-label="Eliminar">'+svg("trash")+'</button>'
      + '</div></div>';
  }).join("")+'</div>'
  : empty(isT?"table":"bed", isT?"Aún sin mesas":"Aún sin habitaciones",
      isT?"Crea tus mesas y arrastra (o toca) a los invitados para sentarlos."
        :"Crea las habitaciones reservadas y asigna a quienes necesitan hospedaje.",
      '<button class="btn sm pri" onclick="openForm(\''+kind+'\')">'+svg("plus")+(isT?"Nueva mesa":"Nueva habitación")+'</button>');

  const poolHtml = pool.length ? '<div class="chips">'+pool.map(g=>
      '<span class="gchip'+(ui.armed===g.id?" armed":"")+'" draggable="true" onclick="arm(\''+g.id+'\')"'
      + ' ondragstart="event.dataTransfer.setData(\'text/plain\',\''+g.id+'\')">'
      + esc(g.name)+(g.partySize>1?'<span class="p">+'+(g.partySize-1)+'</span>':'')+'</span>').join("")+'</div>'
    : '<div class="sm mut">'+(isT?"Todos los invitados tienen mesa.":"Nadie pendiente de hospedaje.")+'</div>';

  return '<div class="card" style="margin-bottom:13px"><div class="pad">'
      + '<div class="between"><div><div class="k xs mut" style="letter-spacing:.16em;text-transform:uppercase">'+(isT?"Sentados":"Alojados")+'</div>'
      + '<div class="dsp" style="font-size:24px;margin-top:4px">'+seatedTotal+' <span class="mut" style="font-size:15px">/ '+capTotal+' lugares</span></div></div>'
      + '<button class="btn sm pri" onclick="openForm(\''+kind+'\')">'+svg("plus")+(isT?"Mesa":"Habitación")+'</button></div>'
      + '<div class="divline"></div>'
      + '<div class="xs mut" style="margin-bottom:7px">'+(ui.armed?"Ahora toca "+(isT?"una mesa":"una habitación")+" para asignar":"Sin "+(isT?"mesa":"lugar")+": toca un nombre y luego "+(isT?"la mesa":"la habitación")+" (o arrástralo)")+'</div>'
      + poolHtml
    + '</div></div>' + grid;
}
function arm(gid){ ui.armed = ui.armed===gid ? null : gid; render(); }
function dropOn(kind, unitId, gid){
  const g = gid || ui.armed; if(!g) return;
  const key = kind==="table"?"tables":"rooms";
  state[key].forEach(u=>u.guestIds=u.guestIds.filter(x=>x!==g));
  const u = state[key].find(x=>x.id===unitId);
  if(u && u.guestIds.indexOf(g)<0) u.guestIds.push(g);
  ui.armed=null; save([key]); render();
}
function unassign(kind,unitId,gid){ const key=kind==="table"?"tables":"rooms";
  const u=state[key].find(x=>x.id===unitId); if(!u) return;
  u.guestIds=u.guestIds.filter(x=>x!==gid); save([key]); render(); }
function delUnit(kind,id){ const key=kind==="table"?"tables":"rooms";
  if(!confirm("¿Eliminar? Los invitados asignados quedarán libres.")) return;
  state[key]=state[key].filter(u=>u.id!==id); save([key]); render(); }

    + '<button class="btn block ghost" style="margin-top:8px" onclick="document.getElementById(\'fileCsv\').click()">O subir un archivo CSV</button>',
    "ui.importer=null");
}
function splitLine(line){
  const sep = line.indexOf("\t")>=0 ? "\t" : line.indexOf(";")>=0 ? ";" : ",";
  const out=[]; let cur="", q=false;
  for(let i=0;i<line.length;i++){ const c=line[i];
    if(c==='"'){ if(q && line[i+1]==='"'){cur+='"';i++;} else q=!q; }
    else if(c===sep && !q){ out.push(cur); cur=""; }
    else cur+=c; }
  out.push(cur); return out.map(x=>x.trim());
}
function parseRsvp(v){ const s=String(v||"").toLowerCase();
  if(/conf|si|sí|yes|asiste/.test(s) && !/no asiste/.test(s)) return "confirmed";
  if(/no asiste|declin|rechaz|cancel/.test(s)) return "declined"; return null; }
function importGuestsText(text, defGroup, defRsvp){
  const lines = String(text||"").replace(/\r/g,"").split("\n").filter(l=>l.trim());
  if(!lines.length){ toast("No pegaste ninguna lista"); return; }
  if(/^(nombre|name)\b/i.test(lines[0])) lines.shift();
  let n=0;
  lines.forEach(l=>{ const c=splitLine(l); const name=(c[0]||"").trim(); if(!name) return;
    state.guests.push({id:uid(), name, partySize:Math.max(1,Number(c[1])||1), group:(c[2]||"").trim()||defGroup,
      rsvp:parseRsvp(c[3])||defRsvp, contact:(c[4]||"").trim(), notes:(c[5]||"").trim(),
      needsLodging:false, diet:""}); n++; });
  if(!n){ toast("No encontré nombres válidos"); return; }
  save("guests"); ui.importer=null; render(); toast(n+" invitados importados");
}
function runGuestImport(){ importGuestsText(val("impText"), val("impGroup"), val("impRsvp")); }

function mergeImported(d){
  const inc = normalize(d);
  state.settings = {...state.settings, ...inc.settings};
  if(inc.notes) state.notes = state.notes ? state.notes+"\n\n"+inc.notes : inc.notes;
  if(inc.venue && inc.venue.notes) state.venue.notes = inc.venue.notes;
  let added=0;
  ARR.forEach(k=>{
    if(!inc[k] || !inc[k].length) return;
    if(k==="tasks" || k==="budget"){
      const custom = inc[k];                     // reemplaza plantillas por lo del archivo
      state[k] = custom; added += custom.length;
    } else {
      const have = new Set(state[k].map(x=>x.id));
      inc[k].forEach(x=>{ if(!have.has(x.id)){ state[k].push(x); added++; } });
    }
  });
  save(); ui.importer=null; render(); toast("Listo: "+added+" registros importados");
}

function buildSharePayload(o){

  state.vendors.forEach(v=>vend[v.id]=v);
  const p = {v:1, couple:s.couple||"", date:s.date||"", venue:s.venueName||"",
    city:s.venueLocation||"", updated:todayISO()};
  if(o.timeline) p.timeline = state.timeline.slice().sort((a,b)=>(a.time||"").localeCompare(b.time||""))
    .map(t=>{ const v = t.vendorId && vend[t.vendorId];
      return {t:t.time||"", e:t.end||"", title:t.title||"", block:t.block||"", owner:t.owner||"",
        vendor: v?v.name:"", phone: v?(v.phone||""):"", notes:t.notes||""}; });
  if(o.tables) p.tables = state.tables.map(t=>({label:t.label||"Mesa", capacity:Number(t.capacity)||0,
    guests: t.guestIds.map(id=>{ const g=gById[id]; if(!g) return null;
      return {name:g.name, extra:Math.max(0,(Number(g.partySize)||1)-1), diet:o.diet?(g.diet||""):""}; }).filter(Boolean)}));
  if(o.songs) p.songs = state.songs.map(x=>({moment:x.moment||"Otros", title:x.title||"",
    artist:x.artist||"", status:x.status||"", notes:x.notes||""}));
  if(o.veto) p.veto = state.blacklist.map(b=>({name:b.name||"", tipo:b.tipo||"", nivel:b.nivel||"", reason:b.reason||""}));
  if(o.sponsors) p.sponsors = state.sponsors.map(x=>({name:x.name||"", role:x.role||""}));
  if(o.tasks) p.tasks = state.tasks.filter(t=>!t.done).slice(0,40)
    .map(t=>({title:t.title||"", due:taskDue(t), phase:t.phase||"", done:false}));
  if(o.contacts){
    const list = state.contacts.map(c=>({name:c.name||"", role:c.role||"", phone:c.phone||""}));
    state.vendors.filter(v=>v.phone && (v.status==="Contratado"||v.status==="Pagado"))
      .forEach(v=>list.push({name:v.name||"", role:v.service||"Proveedor", phone:v.phone||""}));

}

function fld(id,label,input){ return '<div class="field"><label for="'+id+'">'+esc(label)+'</label>'+input+'</div>'; }
function openForm(kind, id){
  const F = FORMS[kind]; if(!F) return;
  const item = id ? (state[F.key]||[]).find(x=>x.id===id) : null;
  ui.form = {kind, id: id||null, data: item ? {...item} : {}};
  ui.more=false; ui.settings=false; render();
  setTimeout(()=>{ const first=document.querySelector(".sheet input,.sheet select,.sheet textarea"); if(first) first.focus(); },60);
}
function formSheet(){
  const {kind, id, data} = ui.form, F = FORMS[kind];
  const body = F.fields(data)
    + '<button class="btn block pri" style="margin-top:6px" onclick="saveForm()">'+svg("check")+(id?"Guardar cambios":"Agregar")+'</button>'
    + (id?'<button class="btn block ghost danger" style="margin-top:8px" onclick="delItem(\''+F.key+'\',\''+id+'\');ui.form=null;render()">Eliminar</button>':'');
  return sheet((id?"Editar ":"")+F.title, body, "ui.form=null");
}
function saveForm(){
  const {kind, id} = ui.form, F = FORMS[kind];
  const data = F.read();
  if(F.req && !data[F.req]){ toast(F.reqMsg||"Falta un dato"); return; }
  const list = state[F.key] = state[F.key] || [];
  if(id){ const i=list.findIndex(x=>x.id===id); if(i>=0) list[i]={...list[i], ...data}; }
  else list.push({id:uid(), ...(F.extra||{}), ...data});
  ui.form=null; save([F.key]); render(); toast(id?"Cambios guardados":F.title+" agregado");
}
function delItem(key,id){
  if(!confirm("¿Eliminar este registro?")) return;
  state[key]=(state[key]||[]).filter(x=>x.id!==id);
  if(key==="vendors") state.timeline.forEach(t=>{ if(t.vendorId===id) t.vendorId=""; });
  save([key,"timeline"]); render();
}
function toggleField(key,id,field){ const x=(state[key]||[]).find(y=>y.id===id); if(!x) return;
  x[field]=!x[field]; save([key]); render(); }

/* ============================ ARRANQUE ============================ */
document.getElementById("fileJson").addEventListener("change", function(e){
  const f=e.target.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ mergeImported(JSON.parse(r.result)); }catch(err){ toast("El archivo no se pudo leer"); } };
  r.readAsText(f); e.target.value="";
});
document.getElementById("fileCsv").addEventListener("change", function(e){
  const f=e.target.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>importGuestsText(r.result, "Lado de la novia", "pending");
  r.readAsText(f); e.target.value="";
});
document.addEventListener("keydown", e=>{
  if(e.key==="Escape" && (ui.form||ui.more||ui.settings||ui.importer||ui.print||ui.share)){
    ui.form=null; ui.more=ui.settings=ui.print=false; ui.importer=null; ui.share=null; render();
  }
});

if(cached) state = cached;
render();
